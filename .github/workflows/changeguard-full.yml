name: PatchCheck frozen verifier

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: changeguard-ft06-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  score:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        (
          (
            github.event.action != 'labeled' &&
            github.event.pull_request.user.login == 'tkim602' &&
            startsWith(github.event.pull_request.title, '[Demo]')
          ) ||
          (
            github.event.action == 'labeled' &&
            github.event.label.name == 'changeguard-model'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect immutable PR input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m patchcheck.github_demo collect --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --output pr.json
      - name: Exact 8K preflight
        id: preflight
        continue-on-error: true
        env:
          PYTHONPATH: src:.
        run: |
          python -m pip install modal==1.5.2 transformers==5.15.0 jinja2==3.1.6
          python scripts/ft06_prompt_preflight.py --input pr.json --output preflight.json
      - name: Run scale-to-zero model
        id: model
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          MODAL_ENVIRONMENT: changeguard-demo
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run deployment/changeguard_ft06.py --input pr.json --output model.json
      - name: Render advisory report
        env:
          PYTHONPATH: src
        run: |
          if ! test -f model.json; then
            if test "${{ steps.preflight.outcome }}" != "success"; then
              if test -f preflight.json; then
                cp preflight.json model.json
              else
                printf '{"status":"MODEL_NOT_RUN: PREFLIGHT_FAILED"}\n' > model.json
              fi
            else
              printf '{"status":"MODEL_NOT_RUN: MODAL_FAILED"}\n' > model.json
            fi
          fi
          python -m patchcheck.github_demo analyze --input pr.json --model model.json --output patchcheck.json --markdown patchcheck.md
          cat patchcheck.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update one PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m patchcheck.github_demo comment --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --markdown patchcheck.md
      - uses: actions/upload-artifact@v7
        with:
          name: patchcheck-full-${{ github.event.pull_request.number || inputs.pull_request }}
          path: |
            patchcheck.json
            patchcheck.md
            model.json
          if-no-files-found: ignore
      - name: Require completed model result
        run: >-
          python -c "import json; status = json.load(open('model.json'))['status']; assert status == 'complete', status"
