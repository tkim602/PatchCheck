name: ChangeGuard frozen FT06 model

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect immutable PR input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m changeguard.github_demo collect --repo "$GITHUB_REPOSITORY" --pr "${{ inputs.pull_request }}" --output pr.json
      - name: Exact 8K preflight
        id: preflight
        continue-on-error: true
        env:
          PYTHONPATH: src:.
        run: |
          python -m pip install modal==1.5.2 transformers==5.15.0
          python scripts/ft06_prompt_preflight.py --input pr.json --output preflight.json
      - name: Run scale-to-zero model
        id: model
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run deployment/changeguard_ft06.py --input pr.json --output model.json
      - name: Render advisory report
        env:
          PYTHONPATH: src
        run: |
          if ! test -f model.json; then
            if test "${{ steps.preflight.outcome }}" != "success"; then
              if test -f preflight.json; then
                cp preflight.json model.json
              else
                printf '{"status":"MODEL_NOT_RUN: PREFLIGHT_FAILED"}\n' > model.json
              fi
            else
              printf '{"status":"MODEL_NOT_RUN: MODAL_FAILED"}\n' > model.json
            fi
          fi
          python -m changeguard.github_demo analyze --input pr.json --model model.json --output changeguard.json --markdown changeguard.md
          cat changeguard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update one PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m changeguard.github_demo comment --repo "$GITHUB_REPOSITORY" --pr "${{ inputs.pull_request }}" --markdown changeguard.md
      - uses: actions/upload-artifact@v4
        with:
          name: changeguard-full-${{ inputs.pull_request }}
          path: |
            changeguard.json
            changeguard.md
            model.json
          if-no-files-found: ignore
