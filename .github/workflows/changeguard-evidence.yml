name: PatchCheck code-change flags

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect immutable PR input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m patchcheck.github_demo collect --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}" --output pr.json
      - name: Analyze code-change flags
        env:
          PYTHONPATH: src
        run: |
          python -m patchcheck.github_demo analyze --input pr.json --output patchcheck.json --markdown patchcheck.md
          cat patchcheck.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: patchcheck-flags-${{ github.event.pull_request.number }}
          path: |
            patchcheck.json
            patchcheck.md
