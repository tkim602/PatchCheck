name: ChangeGuard code-change flags

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect immutable PR input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python -m changeguard.github_demo collect --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}" --output pr.json
      - name: Analyze code-change flags
        env:
          PYTHONPATH: src
        run: |
          python -m changeguard.github_demo analyze --input pr.json --output changeguard.json --markdown changeguard.md
          cat changeguard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: changeguard-flags-${{ github.event.pull_request.number }}
          path: |
            changeguard.json
            changeguard.md
